name: CI
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Unit tests with coverage: fails under 60 % (thresholds in vitest.config.js)
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      # End-to-end tests on desktop and phone screens, with axe-core accessibility checks
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-reports
          path: |
            web/coverage/
            web/playwright-report/
          retention-days: 7

  reco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd reco && pip install -r requirements.txt
      - run: cd reco && pytest
